/* =====================================================
   FIREBASE
===================================================== */

import {
    db
}
from "./firebase-config.js";


import {
    collection,
    getDocs
}
from
"https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";


/* =====================================================
   URL PARAMETERS
===================================================== */

const params =
    new URLSearchParams(
        window.location.search
    );


const courseId =
    params.get(
        "courseId"
    );


const subject =
    params.get(
        "subject"
    );


const chapter =
    params.get(
        "chapter"
    );


const courseName =
    params.get(
        "courseName"
    );


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value){

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


/* =====================================================
   NORMALIZE
===================================================== */

function normalize(value){

    return String(
        value ?? ""
    )
    .trim()
    .toLowerCase();

}


/* =====================================================
   SHOW INFO
===================================================== */

function showInfo(){

    document.getElementById(
        "courseName"
    ).textContent =
        courseName ||
        courseId ||
        "Course";


    document.getElementById(
        "subjectName"
    ).textContent =
        subject ||
        "Subject";


    document.getElementById(
        "chapterName"
    ).textContent =
        chapter ||
        "Chapter";

}


/* =====================================================
   LOAD PDFS
===================================================== */

async function loadPDFs(){

    const container =
        document.getElementById(
            "pdfList"
        );


    if(
        !courseId ||
        !subject ||
        !chapter
    ){

        container.innerHTML = `

            <div class="error">

                ❌ Course, Subject या Chapter
                की जानकारी नहीं मिली।

            </div>

        `;

        return;

    }


    container.innerHTML = `

        <div class="loading">

            ⏳ PDFs loading...

        </div>

    `;


    try{

        const snapshot =
            await getDocs(
                collection(
                    db,
                    "pdfs"
                )
            );


        const pdfs = [];


        snapshot.forEach(
            function(docItem){

                const data =
                    docItem.data();


                /*
                 * Course ID + Subject +
                 * Chapter match
                 */

                const courseMatch =
                    normalize(
                        data.courseId
                    ) ===
                    normalize(
                        courseId
                    );


                const subjectMatch =
                    normalize(
                        data.subject
                    ) ===
                    normalize(
                        subject
                    );


                const chapterMatch =
                    normalize(
                        data.chapter
                    ) ===
                    normalize(
                        chapter
                    );


                if(
                    courseMatch &&
                    subjectMatch &&
                    chapterMatch
                ){

                    pdfs.push({

                        id:
                            docItem.id,

                        ...data

                    });

                }

            }
        );


        if(
            pdfs.length === 0
        ){

            container.innerHTML = `

                <div class="empty">

                    📄 इस Chapter के लिए
                    अभी कोई PDF उपलब्ध नहीं है।

                </div>

            `;

            return;

        }


        container.innerHTML =
            pdfs
            .map(
                function(pdf){

                    return `

                        <div
                            class="pdf-card"
                        >

                            <div
                                class="pdf-title"
                            >

                                📄
                                ${escapeHTML(
                                    pdf.title ||
                                    "Study PDF"
                                )}

                            </div>


                            ${
                                pdf.description
                                ?
                                `

                                    <div
                                        class="pdf-description"
                                    >

                                        ${escapeHTML(
                                            pdf.description
                                        )}

                                    </div>

                                `
                                :
                                ""
                            }


                            ${
                                pdf.fileName
                                ?
                                `

                                    <div
                                        class="pdf-file"
                                    >

                                        📁
                                        ${escapeHTML(
                                            pdf.fileName
                                        )}

                                    </div>

                                `
                                :
                                ""
                            }


                            ${
                                pdf.url
                                ?
                                `

                                    <a
                                        class="open-btn"
                                        href="${escapeHTML(
                                            pdf.url
                                        )}"
                                        target="_blank"
                                        rel="noopener noreferrer"
                                    >

                                        📖 Open PDF

                                    </a>

                                `
                                :
                                `

                                    <div class="error">

                                        ❌ PDF उपलब्ध नहीं है।

                                    </div>

                                `
                            }

                        </div>

                    `;

                }
            )
            .join("");

    }
    catch(error){

        console.error(
            "Student PDF load error:",
            error
        );


        container.innerHTML = `

            <div class="error">

                ❌ PDFs load नहीं हो पाए।

                <br><br>

                ${escapeHTML(
                    error?.message ||
                    error
                )}

            </div>

        `;

    }

}


/* =====================================================
   BACK
===================================================== */

function goBack(){

    /*
     * Previous page पर वापस जाएं
     */

    if(
        document.referrer &&
        document.referrer.includes(
            window.location.hostname
        )
    ){

        window.history.back();

    }
    else{

        window.location.href =
            "chapters.html";

    }

}


window.goBack =
    goBack;


/* =====================================================
   START
===================================================== */

function start(){

    showInfo();

    loadPDFs();

}


start();

</script></body></html>
