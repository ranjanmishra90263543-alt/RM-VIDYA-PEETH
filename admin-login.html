<!DOCTYPE html>
<html lang="hi">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>RM Vidya Peeth - Admin Login</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background: #0f172a;
            color: white;
            font-family: Arial, sans-serif;
        }

        .page-wrapper {
            flex: 1;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 15px;
        }

        .login-box {
            width: 100%;
            max-width: 400px;
            background: #1e293b;
            padding: 30px 25px;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, .35);
            border: 1px solid #334155;
        }

        h1 {
            text-align: center;
            margin: 0 0 8px;
            font-size: 34px;
        }

        .subtitle {
            text-align: center;
            color: #93c5fd;
            margin-bottom: 5px;
            line-height: 1.5;
            font-size: 18px;
            font-weight: bold;
        }

        .byline {
            text-align: center;
            color: #cbd5e1;
            margin-bottom: 28px;
            font-size: 14px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 18px;
            border: 1px solid #475569;
            border-radius: 9px;
            background: #0f172a;
            color: white;
            outline: none;
            font-size: 16px;
        }

        input:focus {
            border-color: #60a5fa;
            box-shadow: 0 0 0 2px rgba(96, 165, 250, .15);
        }

        input::placeholder {
            color: #94a3b8;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 9px;
            background: #2563eb;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        button:disabled {
            opacity: .7;
            cursor: not-allowed;
        }

        .message {
            min-height: 25px;
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
            line-height: 1.5;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 22px;
            color: #93c5fd;
            text-decoration: none;
        }

        .back:hover {
            text-decoration: underline;
        }

        .the-hub-copyright {
            width: 100%;
            text-align: center;
            padding: 16px 12px;
            color: #cbd5e1;
            font-size: 14px;
            background: #0f172a;
        }

    </style>

</head>


<body>

<div class="page-wrapper">

    <div class="login-box">

        <h1>👑 Admin Login</h1>

        <div class="subtitle">RM Vidya Peeth</div>

        <div class="byline">By Ranjan Mishra Sir</div>


        <form id="adminLoginForm">

            <label for="adminEmail">📧 Admin Email</label>

            <input
                type="email"
                id="adminEmail"
                placeholder="Admin Email"
                autocomplete="username"
                required
            >

            <label for="adminPassword">🔐 Password</label>

            <input
                type="password"
                id="adminPassword"
                placeholder="Password"
                autocomplete="current-password"
                required
            >

            <button type="submit" id="loginButton">
                🔐 Login
            </button>

        </form>


        <div id="loginMessage" class="message"></div>


        <a href="login.html" class="back">
            ← Student Login
        </a>

    </div>

</div>


<footer class="the-hub-copyright">
    © 2026 RM Vidya Peeth. All Rights Reserved.<br>
    By Ranjan Mishra Sir
</footer>


<!-- सारा login logic admin-login.js में है (inline duplicate हटा दिया) -->
<script type="module" src="./admin-login.js"></script>

</body>

</html>
