<!DOCTYPE html>
<html lang="hi">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1.0"
>

<title>RM Vidya Peeth - Free Mock Tests</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#0f172a;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

.page{
    max-width:1000px;
    margin:auto;
    padding:18px 14px 80px;
}

.header{
    background:#1e293b;
    border:1px solid #334155;
    border-radius:16px;
    padding:22px;
    margin-bottom:18px;
}

.brand-title{
    margin:0 0 4px;
    color:#60a5fa;
    font-size:25px;
    font-weight:800;
}

.brand-tagline{
    margin:0 0 18px;
    color:#cbd5e1;
    font-size:13px;
}

.header h1{
    margin:0 0 8px;
    font-size:27px;
}

.header p{
    margin:0;
    color:#cbd5e1;
    line-height:1.7;
}

.student{
    margin-top:14px;
    padding:11px 14px;
    background:#0f172a;
    border-radius:10px;
    color:#cbd5e1;
}

.category-list{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:14px;
}

.category-card{
    background:#1e293b;
    border:1px solid #334155;
    border-radius:16px;
    padding:20px;
    transition:.2s;
}

.category-card:hover{
    border-color:#60a5fa;
    transform:translateY(-2px);
}

.icon{
    width:55px;
    height:55px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#172554;
    border-radius:12px;
    font-size:27px;
    margin-bottom:14px;
}

.category-card h2{
    margin:0 0 8px;
    font-size:20px;
}

.category-card p{
    margin:0;
    color:#cbd5e1;
    line-height:1.6;
    font-size:14px;
}

.open-btn{
    width:100%;
    margin-top:16px;
    padding:12px;
    border:0;
    border-radius:9px;
    background:#2563eb;
    color:#fff;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
}

.open-btn:hover{
    background:#1d4ed8;
}

.loading,
.error{
    background:#1e293b;
    padding:25px;
    border-radius:12px;
    text-align:center;
    color:#cbd5e1;
}

.error{
    background:#450a0a;
    border:1px solid #991b1b;
    color:#fecaca;
}

footer{
    text-align:center;
    padding:20px;
    color:#94a3b8;
    font-size:13px;
}

.footer-brand{
    color:#60a5fa;
    font-size:16px;
    font-weight:800;
    margin-bottom:4px;
}

.footer-tagline{
    color:#cbd5e1;
    margin-bottom:6px;
}

@media(max-width:650px){

    .category-list{
        grid-template-columns:1fr;
    }

    .header h1{
        font-size:23px;
    }

    .brand-title{
        font-size:22px;
    }

}

</style>

</head>

<body>

<div class="page">

    <div class="header">

        <div class="brand-title">
            RM Vidya Peeth
        </div>

        <div class="brand-tagline">
            By Ranjan Mishra Sir
        </div>

        <h1>
            🆓 Free Mock Tests
        </h1>

        <p>
            अपनी category चुनें और Free Mock Test शुरू करें।
        </p>

        <div
            id="studentInfo"
            class="student"
        >
            👤 Student
        </div>

    </div>


    <div
        id="categoryList"
        class="category-list"
    >

        <div class="loading">
            🔥 Loading...
        </div>

    </div>

</div>


<footer>

    <div class="footer-brand">
        RM Vidya Peeth
    </div>

    <div class="footer-tagline">
        By Ranjan Mishra Sir
    </div>

    © 2026 RM Vidya Peeth. All Rights Reserved.

</footer>


<script>

function escapeHTML(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


function getStudent(){

    try{

        const logged =
            localStorage.getItem(
                "studentLoggedIn"
            );

        const raw =
            localStorage.getItem(
                "studentUser"
            );

        if(
            logged !== "true" ||
            !raw
        ){

            return null;

        }

        return JSON.parse(raw);

    }catch(error){

        return null;

    }

}


function showStudent(){

    const student =
        getStudent();

    if(!student){

        window.location.replace(
            "login.html"
        );

        return false;

    }

    const name =
        student.displayName ||
        student.fullName ||
        student.name ||
        "Student";

    const email =
        student.email ||
        student.username ||
        "";

    document.getElementById(
        "studentInfo"
    ).innerHTML =

        "👤 Welcome, <b>" +

        escapeHTML(name) +

        "</b>" +

        (
            email
            ?
            " · 📧 " +
            escapeHTML(email)
            :
            ""
        );

    return true;

}


const categories = [

    {
        type:"chapter",
        icon:"📖",
        title:"Chapter Tests",
        description:
            "Chapter-wise practice tests. किसी particular chapter की तैयारी के लिए।"
    },

    {
        type:"sectional",
        icon:"📚",
        title:"Sectional Tests",
        description:
            "Subject या section-wise Free Tests देकर अपनी preparation check करें।"
    },

    {
        type:"full",
        icon:"📝",
        title:"Full Tests",
        description:
            "Complete exam pattern पर आधारित Free Full Mock Tests।"
    },

    {
        type:"pyq",
        icon:"🏆",
        title:"PYQ Practice",
        description:
            "Previous Year Questions पर आधारित Free Practice Mock Tests।"
    }

];


function openCategory(type){

    window.location.href =
        "free-tests-list.html?type=" +
        encodeURIComponent(type);

}


function renderCategories(){

    const container =
        document.getElementById(
            "categoryList"
        );

    container.innerHTML =

        categories.map(
            function(category){

                return `

                    <div class="category-card">

                        <div class="icon">
                            ${category.icon}
                        </div>

                        <h2>
                            ${escapeHTML(
                                category.title
                            )}
                        </h2>

                        <p>
                            ${escapeHTML(
                                category.description
                            )}
                        </p>

                        <button
                            class="open-btn"
                            type="button"
                            onclick="openCategory('${category.type}')"
                        >
                            🚀 View Free Tests
                        </button>

                    </div>

                `;

            }
        )
        .join("");

}


document.addEventListener(
    "DOMContentLoaded",
    function(){

        if(!showStudent()){

            return;

        }

        renderCategories();

    }
);

</script>

</body>

</html>
