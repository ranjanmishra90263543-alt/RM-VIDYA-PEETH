<!DOCTYPE html>
<html lang="hi">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>RM Vidya Peeth</title>


    <!-- PWA -->
    <link
        rel="manifest"
        href="manifest.json"
    >

    <meta
        name="theme-color"
        content="#0f172a"
    >

    <meta
        name="description"
        content="RM Vidya Peeth - SSC, Railway, Banking and State Exams Learning and Mock Test App"
    >

    <meta
        name="mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-status-bar-style"
        content="default"
    >

    <meta
        name="apple-mobile-web-app-title"
        content="RM Vidya Peeth"
    >


    <style>

        * {
            box-sizing: border-box;
        }


        html,
        body {

            margin: 0;

            padding: 0;

            width: 100%;

            height: 100%;

            overflow: hidden;

            background: #0f172a;

        }


        /* =================================================
           SPLASH SCREEN
        ================================================= */

        #splashScreen {

            position: fixed;

            inset: 0;

            width: 100vw;

            height: 100vh;

            background: #0f172a;

            display: flex;

            align-items: center;

            justify-content: center;

            z-index: 999999;

            opacity: 1;

            visibility: visible;

            transition:
                opacity 0.5s ease,
                visibility 0.5s ease;

        }


        #splashScreen.hide {

            opacity: 0;

            visibility: hidden;

            pointer-events: none;

        }


        /* =================================================
           SPLASH IMAGE
        ================================================= */

        #splashImage {

            width: 100%;

            height: 100%;

            display: block;

            object-fit: cover;

            object-position: center;

        }


        /* =================================================
           SMALL LOADING INDICATOR
        ================================================= */

        .splash-loader {

            position: absolute;

            left: 50%;

            bottom: 35px;

            transform:
                translateX(-50%);

            width: 150px;

            height: 4px;

            overflow: hidden;

            border-radius: 10px;

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.25
                );

        }


        .splash-loader-bar {

            width: 45%;

            height: 100%;

            border-radius: 10px;

            background: white;

            animation:
                splashLoading 1.1s
                ease-in-out
                infinite;

        }


        @keyframes splashLoading {

            0% {

                transform:
                    translateX(-150%);

            }

            100% {

                transform:
                    translateX(350%);

            }

        }


    </style>

</head>


<body>


<!-- =====================================================
     RM VIDYA PEETH SPLASH
===================================================== -->

<div
    id="splashScreen"
    aria-label="RM Vidya Peeth Splash Screen"
>


    <img
        id="splashImage"
        src="Splash-default.jpg"
        alt="RM Vidya Peeth"
    >


    <div class="splash-loader">

        <div
            class="splash-loader-bar"
        ></div>

    </div>


</div>



<script>


// =====================================================
// RM VIDYA PEETH SPLASH CONTROLLER
// By Ranjan Mishra Sir
// =====================================================

(function () {

    "use strict";


    // =================================================
    // SETTINGS
    // =================================================

    const NEXT_PAGE =
        "home.html";


    // Splash duration
    // 2500 = 2.5 seconds

    const SPLASH_TIME =
        2500;


    // =================================================
    // ELEMENT
    // =================================================

    const splash =
        document.getElementById(
            "splashScreen"
        );


    if (!splash) {

        window.location.replace(
            NEXT_PAGE
        );

        return;

    }


    // =================================================
    // PREVENT DOUBLE REDIRECT
    // =================================================

    let redirected =
        false;


    // =================================================
    // OPEN HOME
    // =================================================

    function openHome() {


        if (redirected) {

            return;

        }


        redirected =
            true;


        // Fade out

        splash.classList.add(
            "hide"
        );


        // Open home after fade

        setTimeout(
            function () {

                window.location.replace(
                    NEXT_PAGE
                );

            },
            500
        );

    }


    // =================================================
    // START TIMER
    // =================================================

    setTimeout(
        openHome,
        SPLASH_TIME
    );


    // =================================================
    // SAFETY REDIRECT
    // =================================================

    setTimeout(
        function () {

            if (!redirected) {

                window.location.replace(
                    NEXT_PAGE
                );

            }

        },
        SPLASH_TIME + 2500
    );


})();


</script>


</body>

</html>
