<!DOCTYPE html>
<html lang="hi">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1.0"
>

<title>THE HUB - Free Test</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#0f172a;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

.page{
    max-width:900px;
    margin:auto;
    padding:15px 12px 80px;
}

/* HEADER */

.header{
    background:#1e293b;
    border:1px solid #334155;
    border-radius:16px;
    padding:18px;
    margin-bottom:15px;
}

.header h1{
    margin:0 0 8px;
    font-size:23px;
}

.header p{
    margin:0;
    color:#cbd5e1;
    line-height:1.6;
}

.student{
    margin-top:12px;
    background:#0f172a;
    padding:10px 12px;
    border-radius:9px;
    color:#cbd5e1;
    font-size:14px;
}

/* TOP BAR */

.topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    margin-bottom:15px;
}

.question-count{
    background:#1e293b;
    border:1px solid #334155;
    padding:10px 13px;
    border-radius:9px;
    font-size:14px;
}

.timer{
    background:#7f1d1d;
    border:1px solid #ef4444;
    padding:10px 14px;
    border-radius:9px;
    font-weight:bold;
    min-width:100px;
    text-align:center;
}

.timer.safe{
    background:#14532d;
    border-color:#22c55e;
}

.timer.warning{
    background:#78350f;
    border-color:#f59e0b;
}

.timer.danger{
    background:#7f1d1d;
    border-color:#ef4444;
}

/* PROGRESS */

.progress-box{
    background:#1e293b;
    border:1px solid #334155;
    padding:10px;
    border-radius:10px;
    margin-bottom:15px;
}

.progress-bar{
    width:100%;
    height:8px;
    background:#334155;
    border-radius:20px;
    overflow:hidden;
}

.progress-fill{
    height:100%;
    width:0%;
    background:#2563eb;
    transition:.25s;
}

/* QUESTION */

.question-card{
    background:#1e293b;
    border:1px solid #334155;
    border-radius:16px;
    padding:20px;
}

.question-number{
    color:#60a5fa;
    font-weight:bold;
    margin-bottom:12px;
}

.question-text{
    font-size:18px;
    line-height:1.7;
    margin-bottom:18px;
    white-space:pre-wrap;
}

/* OPTIONS */

.options{
    display:flex;
    flex-direction:column;
    gap:10px;
}

.option{
    background:#0f172a;
    border:1px solid #475569;
    border-radius:10px;
    padding:13px;
    cursor:pointer;
    transition:.2s;
    line-height:1.5;
}

.option:hover{
    border-color:#60a5fa;
}

.option.selected{
    background:#172554;
    border-color:#2563eb;
}

.option input{
    margin-right:9px;
}

/* NAVIGATION */

.navigation{
    display:flex;
    justify-content:space-between;
    gap:10px;
    margin-top:18px;
}

.nav-btn{
    flex:1;
    padding:12px;
    border:none;
    border-radius:9px;
    cursor:pointer;
    font-weight:bold;
    font-size:15px;
}

.previous{
    background:#475569;
    color:#fff;
}

.next{
    background:#2563eb;
    color:#fff;
}

.submit{
    background:#16a34a;
    color:#fff;
}

.nav-btn:disabled{
    opacity:.45;
    cursor:not-allowed;
}

/* PALETTE */

.palette-box{
    margin-top:18px;
    background:#1e293b;
    border:1px solid #334155;
    border-radius:14px;
    padding:15px;
}

.palette-title{
    font-weight:bold;
    margin-bottom:12px;
}

.palette{
    display:flex;
    flex-wrap:wrap;
    gap:7px;
}

.palette button{
    width:38px;
    height:38px;
    border:none;
    border-radius:7px;
    background:#475569;
    color:#fff;
    cursor:pointer;
    font-weight:bold;
}

.palette button.current{
    outline:2px solid #60a5fa;
}

.palette button.answered{
    background:#16a34a;
}

.palette button.current.answered{
    background:#15803d;
}

/* =====================================================
   RIGHT SIDE QUESTION MENU
===================================================== */

.question-menu-toggle{
    position:fixed;
    right:12px;
    top:50%;
    transform:translateY(-50%);
    z-index:1000;

    width:48px;
    height:48px;

    border:none;
    border-radius:12px;

    background:#2563eb;
    color:#fff;

    font-size:21px;
    font-weight:bold;

    cursor:pointer;

    box-shadow:0 5px 20px rgba(0,0,0,.35);
}

.question-menu-toggle:hover{
    background:#1d4ed8;
}

.question-side-menu{
    position:fixed;

    top:0;
    right:-310px;

    width:290px;
    max-width:85vw;
    height:100vh;

    background:#1e293b;

    border-left:1px solid #475569;

    z-index:9999;

    padding:18px;

    display:flex;
    flex-direction:column;

    transition:right:.25s ease;

    box-shadow:-8px 0 25px rgba(0,0,0,.4);
}

.question-side-menu.open{
    right:0;
}

.question-menu-header{
    display:flex;
    justify-content:space-between;
    align-items:center;

    padding-bottom:15px;

    border-bottom:1px solid #475569;

    margin-bottom:15px;
}

.question-menu-header strong{
    font-size:17px;
}

.question-menu-close{
    width:35px;
    height:35px;

    border:none;
    border-radius:8px;

    background:#475569;
    color:#fff;

    font-size:18px;

    cursor:pointer;
}

.question-side-palette{
    flex:1;

    overflow-y:auto;

    display:grid;

    grid-template-columns:repeat(5,1fr);

    gap:8px;

    align-content:start;
}

.question-side-palette button{
    height:40px;

    border:none;
    border-radius:8px;

    background:#475569;

    color:#fff;

    font-weight:bold;

    cursor:pointer;
}

.question-side-palette button:hover{
    background:#64748b;
}

.question-side-palette button.current{
    outline:2px solid #60a5fa;
}

.question-side-palette button.answered{
    background:#16a34a;
}

.question-side-palette button.current.answered{
    background:#15803d;
}

.side-submit-btn{
    width:100%;

    padding:13px;

    margin-top:15px;

    border:none;
    border-radius:9px;

    background:#16a34a;

    color:#fff;

    font-size:15px;
    font-weight:bold;

    cursor:pointer;
}

.side-submit-btn:hover{
    background:#15803d;
}

.question-menu-overlay{
    position:fixed;

    inset:0;

    background:rgba(0,0,0,.55);

    z-index:9998;

    display:none;
}

.question-menu-overlay.show{
    display:block;
}

/* RESULT */

.result{
    display:none;
}

.result-card{
    background:#1e293b;
    border:1px solid #334155;
    border-radius:16px;
    padding:22px;
    text-align:center;
}

.result-card h2{
    margin-top:0;
}

.score{
    font-size:42px;
    font-weight:bold;
    margin:15px 0;
}

.result-row{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    margin-top:20px;
}

.result-item{
    background:#0f172a;
    border-radius:10px;
    padding:15px 8px;
}

.result-item strong{
    display:block;
    font-size:22px;
    margin-bottom:5px;
}

.result-actions{
    display:flex;
    gap:10px;
    margin-top:20px;
}

.result-actions button{
    flex:1;
    padding:12px;
    border:none;
    border-radius:9px;
    color:#fff;
    font-weight:bold;
    cursor:pointer;
}

.home-btn{
    background:#475569;
}

.retry-btn{
    background:#2563eb;
}

/* LOADING */

.loading,
.error{
    background:#1e293b;
    border-radius:12px;
    padding:25px;
    text-align:center;
    color:#cbd5e1;
}

.error{
    background:#450a0a;
    border:1px solid #991b1b;
    color:#fecaca;
}

/* MOBILE */

@media(max-width:600px){

    .page{
        padding:10px 9px 60px;
    }

    .header h1{
        font-size:20px;
    }

    .question-card{
        padding:16px;
    }

    .question-text{
        font-size:17px;
    }

    .topbar{
        align-items:stretch;
    }

    .question-count,
    .timer{
        flex:1;
    }

    .result-row{
        grid-template-columns:1fr;
    }

    .navigation{
        flex-wrap:wrap;
    }

    .nav-btn{
        min-width:45%;
    }

    .question-menu-toggle{
        right:8px;
        width:44px;
        height:44px;
    }

    .question-side-menu{
        width:280px;
    }

}

footer{
    text-align:center;
    color:#94a3b8;
    font-size:13px;
    padding:20px;
}

</style>

</head>

<body>


<!-- =====================================================
     RIGHT SIDE QUESTION MENU
===================================================== -->

<button
    id="questionMenuToggle"
    class="question-menu-toggle"
    type="button"
    onclick="toggleQuestionMenu()"
    aria-label="Question Menu"
>
    ☰
</button>


<div
    id="questionMenuOverlay"
    class="question-menu-overlay"
    onclick="closeQuestionMenu()"
></div>


<div
    id="questionSideMenu"
    class="question-side-menu"
>

    <div class="question-menu-header">

        <strong>
            📋 Questions
        </strong>

        <button
            class="question-menu-close"
            type="button"
            onclick="closeQuestionMenu()"
        >
            ✕
        </button>

    </div>


    <div
        id="sideQuestionPalette"
        class="question-side-palette"
    ></div>


    <button
        id="sideSubmitBtn"
        class="side-submit-btn"
        type="button"
        onclick="confirmSubmit()"
    >
        ✅ Submit Test
    </button>

</div>


<div class="page">

    <!-- HEADER -->

    <div class="header">

        <h1 id="testTitle">
            🆓 Free Test
        </h1>

        <p id="testDescription">
            Test शुरू हो रहा है...
        </p>

        <div
            id="studentInfo"
            class="student"
        >
            👤 Student
        </div>

    </div>


    <!-- TEST AREA -->

    <div id="testArea">

        <div class="topbar">

            <div
                id="questionCount"
                class="question-count"
            >
                Question 0 / 0
            </div>

            <div
                id="timer"
                class="timer"
            >
                ⏱️ 00:00
            </div>

        </div>


        <div class="progress-box">

            <div class="progress-bar">

                <div
                    id="progressFill"
                    class="progress-fill"
                ></div>

            </div>

        </div>


        <div
            id="questionCard"
            class="question-card"
        >

            <div class="loading">
                🔥 Question loading...
            </div>

        </div>


        <div class="navigation">

            <button
                id="previousBtn"
                class="nav-btn previous"
                type="button"
                onclick="previousQuestion()"
            >
                ← Previous
            </button>


            <button
                id="nextBtn"
                class="nav-btn next"
                type="button"
                onclick="nextQuestion()"
            >
                Next →
            </button>


            <button
                id="submitBtn"
                class="nav-btn submit"
                type="button"
                onclick="confirmSubmit()"
                style="display:none"
            >
                ✅ Submit Test
            </button>

        </div>


        <!-- OLD PALETTE
             रखा गया है ताकि existing functionality
             खराब न हो
        -->

        <div class="palette-box">

            <div class="palette-title">
                📋 Question Navigation
            </div>

            <div
                id="palette"
                class="palette"
            ></div>

        </div>

    </div>


    <!-- RESULT -->

    <div
        id="result"
        class="result"
    >

        <div class="result-card">

            <h2>
                🎉 Test Completed
            </h2>

            <div
                id="resultTestName"
            >
                Free Test
            </div>

            <div
                id="score"
                class="score"
            >
                0 / 0
            </div>


            <div class="result-row">

                <div class="result-item">

                    <strong
                        id="correctCount"
                    >
                        0
                    </strong>

                    Correct

                </div>


                <div class="result-item">

                    <strong
                        id="wrongCount"
                    >
                        0
                    </strong>

                    Wrong

                </div>


                <div class="result-item">

                    <strong
                        id="unansweredCount"
                    >
                        0
                    </strong>

                    Unanswered

                </div>

            </div>


            <div
                id="percentage"
                style="margin-top:18px;color:#cbd5e1"
            >
                Percentage: 0%
            </div>


            <div class="result-actions">

                <button
                    class="home-btn"
                    type="button"
                    onclick="goBackToFreeTests()"
                >
                    ← Free Tests
                </button>

                <button
                    class="retry-btn"
                    type="button"
                    onclick="retryTest()"
                >
                    🔄 Retry Test
                </button>

            </div>

        </div>

    </div>

</div>


<footer>
    © 2026 THE HUB. All Rights Reserved.
</footer>


<script>

/* =====================================================
   GLOBAL
===================================================== */

let selectedTest = null;

let questions = [];

let currentQuestion = 0;

let answers = [];

let submitted = false;

let timerSeconds = 0;

let timerInterval = null;


/* =====================================================
   ESCAPE
===================================================== */

function escapeHTML(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =====================================================
   NORMALIZE
===================================================== */

function normalize(value){

    return String(value ?? "")
        .trim()
        .toLowerCase();

}


/* =====================================================
   GET STUDENT
===================================================== */

function getStudent(){

    try{

        const logged =
            localStorage.getItem(
                "studentLoggedIn"
            );

        const raw =
            localStorage.getItem(
                "studentUser"
            );


        if(
            logged !== "true" ||
            !raw
        ){

            return null;

        }


        return JSON.parse(raw);

    }catch(error){

        return null;

    }

}


/* =====================================================
   SHOW STUDENT
===================================================== */

function showStudent(){

    const student =
        getStudent();


    if(!student){

        window.location.replace(
            "login.html"
        );

        return false;

    }


    const name =
        student.displayName ||
        student.fullName ||
        student.name ||
        "Student";


    const email =
        student.email ||
        student.username ||
        "";


    document.getElementById(
        "studentInfo"
    ).innerHTML =

        "👤 Welcome, <b>" +

        escapeHTML(name) +

        "</b>" +

        (
            email
            ?
            " · 📧 " +
            escapeHTML(email)
            :
            ""
        );


    return true;

}


/* =====================================================
   LOAD SELECTED TEST
===================================================== */

function loadSelectedTest(){

    try{

        const raw =
            localStorage.getItem(
                "selectedDynamicTest"
            );


        if(!raw){

            return null;

        }


        const data =
            JSON.parse(raw);


        if(
            !data ||
            typeof data !== "object"
        ){

            return null;

        }


        return data;

    }catch(error){

        console.error(
            "Selected test error:",
            error
        );

        return null;

    }

}


/* =====================================================
   NORMALIZE QUESTIONS
===================================================== */

function normalizeQuestion(question,index){

    const q =
        question || {};


    let options = [];


    if(
        Array.isArray(q.options)
    ){

        options =
            q.options.slice(0,10);

    }


    if(
        !options.length &&
        q.options &&
        typeof q.options === "object"
    ){

        options = [

            q.options.A ??
            q.options.a ??
            "",

            q.options.B ??
            q.options.b ??
            "",

            q.options.C ??
            q.options.c ??
            "",

            q.options.D ??
            q.options.d ??
            ""

        ];

    }


    if(!options.length){

        const possible = [

            q.optionA,
            q.optionB,
            q.optionC,
            q.optionD

        ];


        if(
            possible.some(
                value =>
                    String(
                        value ?? ""
                    ).trim() !== ""
            )
        ){

            options = possible;

        }

    }


    if(!options.length){

        const possible = [

            q.option1,
            q.option2,
            q.option3,
            q.option4

        ];


        if(
            possible.some(
                value =>
                    String(
                        value ?? ""
                    ).trim() !== ""
            )
        ){

            options = possible;

        }

    }


    const correct =
        q.correctAnswer ??
        q.answer ??
        q.correct ??
        q.correctOption ??
        q.rightAnswer ??
        "";


    return {

        id:
            q.id ||
            "question-" +
            index,

        question:
            q.question ||
            q.questionText ||
            q.text ||
            q.que ||
            "",

        options:
            options.map(
                value =>
                    String(
                        value ?? ""
                    )
            ),

        correctAnswer:
            correct,

        explanation:
            q.explanation ||
            q.solution ||
            "",

        subject:
            q.subject ||
            "",

        chapter:
            q.chapter ||
            ""

    };

}


/* =====================================================
   CORRECT ANSWER INDEX
===================================================== */

function getCorrectIndex(question){

    const answer =
        question.correctAnswer;


    if(
        answer === null ||
        answer === undefined
    ){

        return -1;

    }


    const value =
        normalize(answer);


    const letters = [
        "a",
        "b",
        "c",
        "d",
        "e",
        "f"
    ];


    const letterIndex =
        letters.indexOf(value);


    if(
        letterIndex >= 0 &&
        letterIndex <
        question.options.length
    ){

        return letterIndex;

    }


    const number =
        Number(value);


    if(
        Number.isInteger(number) &&
        number >= 1 &&
        number <=
        question.options.length
    ){

        return number - 1;

    }


    const textIndex =
        question.options.findIndex(
            option =>
                normalize(option) ===
                value
        );


    if(textIndex >= 0){

        return textIndex;

    }


    return -1;

}


/* =====================================================
   START TIMER
===================================================== */

function startTimer(){

    clearInterval(
        timerInterval
    );


    const minutes =
        Number(
            selectedTest.testTime ||
            localStorage.getItem(
                "selectedTestTime"
            ) ||
            0
        );


    if(
        !minutes ||
        minutes <= 0
    ){

        document.getElementById(
            "timer"
        ).textContent =
            "⏱️ No Limit";

        return;

    }


    timerSeconds =
        Math.round(
            minutes * 60
        );


    updateTimer();


    timerInterval =
        setInterval(
            function(){

                timerSeconds--;

                updateTimer();


                if(
                    timerSeconds <= 0
                ){

                    clearInterval(
                        timerInterval
                    );


                    alert(
                        "⏰ Test का समय समाप्त हो गया।"
                    );


                    submitTest(true);

                }

            },
            1000
        );

}


/* =====================================================
   UPDATE TIMER
===================================================== */

function updateTimer(){

    const timer =
        document.getElementById(
            "timer"
        );


    if(
        timerSeconds <= 0
    ){

        timer.textContent =
            "⏱️ 00:00";

        return;

    }


    const minutes =
        Math.floor(
            timerSeconds / 60
        );


    const seconds =
        timerSeconds % 60;


    timer.textContent =

        "⏱️ " +

        String(minutes)
            .padStart(2,"0") +

        ":" +

        String(seconds)
            .padStart(2,"0");


    timer.classList.remove(
        "safe",
        "warning",
        "danger"
    );


    if(
        timerSeconds <= 60
    ){

        timer.classList.add(
            "danger"
        );

    }
    else if(
        timerSeconds <= 300
    ){

        timer.classList.add(
            "warning"
        );

    }
    else{

        timer.classList.add(
            "safe"
        );

    }

}


/* =====================================================
   RENDER QUESTION
===================================================== */

function renderQuestion(){

    if(
        submitted ||
        !questions.length
    ){

        return;

    }


    const question =
        questions[
            currentQuestion
        ];


    const card =
        document.getElementById(
            "questionCard"
        );


    const selected =
        answers[
            currentQuestion
        ];


    card.innerHTML = `

        <div class="question-number">

            Question ${currentQuestion + 1}
            / ${questions.length}

        </div>


        <div class="question-text">

            ${escapeHTML(
                question.question
            )}

        </div>


        <div class="options">

            ${
                question.options
                .map(
                    function(option,index){

                        const checked =
                            selected === index;


                        const letter =
                            String.fromCharCode(
                                65 + index
                            );


                        return `

                        <div
                            class="option ${
                                checked
                                ?
                                "selected"
                                :
                                ""
                            }"
                            onclick="selectAnswer(${index})"
                        >

                            <input
                                type="radio"
                                name="answer"
                                ${
                                    checked
                                    ?
                                    "checked"
                                    :
                                    ""
                                }
                                onclick="event.stopPropagation();selectAnswer(${index})"
                            >

                            <b>
                                ${letter}.
                            </b>

                            ${escapeHTML(
                                option
                            )}

                        </div>

                        `;

                    }
                )
                .join("")
            }

        </div>

    `;


    updateNavigation();

    updateProgress();

    renderPalette();

}


/* =====================================================
   SELECT ANSWER
===================================================== */

function selectAnswer(index){

    if(submitted){

        return;

    }


    answers[
        currentQuestion
    ] =
        Number(index);


    renderQuestion();

}


/* =====================================================
   NEXT
===================================================== */

function nextQuestion(){

    if(
        currentQuestion <
        questions.length - 1
    ){

        currentQuestion++;

        renderQuestion();

    }

}


/* =====================================================
   PREVIOUS
===================================================== */

function previousQuestion(){

    if(
        currentQuestion > 0
    ){

        currentQuestion--;

        renderQuestion();

    }

}


/* =====================================================
   UPDATE NAVIGATION
===================================================== */

function updateNavigation(){

    const previous =
        document.getElementById(
            "previousBtn"
        );

    const next =
        document.getElementById(
            "nextBtn"
        );

    const submit =
        document.getElementById(
            "submitBtn"
        );


    previous.disabled =
        currentQuestion === 0;


    /*
     * LAST QUESTION
     */

    if(
        currentQuestion ===
        questions.length - 1
    ){

        next.style.display =
            "none";

        submit.style.display =
            "block";

    }

    /*
     * NORMAL QUESTION
     */

    else{

        next.style.display =
            "block";

        submit.style.display =
            "none";

    }

}


/* =====================================================
   PROGRESS
===================================================== */

function updateProgress(){

    const count =
        questions.length;


    const percent =
        count
        ?
        (
            (
                currentQuestion + 1
            )
            /
            count
        )
        * 100
        :
        0;


    document.getElementById(
        "progressFill"
    ).style.width =
        percent + "%";


    document.getElementById(
        "questionCount"
    ).textContent =

        "Question " +

        (
            currentQuestion + 1
        ) +

        " / " +

        count;

}


/* =====================================================
   PALETTE
===================================================== */

function renderPalette(){

    const palette =
        document.getElementById(
            "palette"
        );

    const sidePalette =
        document.getElementById(
            "sideQuestionPalette"
        );


    const html =
        questions
        .map(
            function(question,index){

                const answered =
                    answers[index] !== null &&
                    answers[index] !== undefined;


                const current =
                    index === currentQuestion;


                return `

                    <button
                        type="button"
                        class="${
                            current
                            ?
                            "current "
                            :
                            ""
                        }${
                            answered
                            ?
                            "answered"
                            :
                            ""
                        }"
                        onclick="goToQuestion(${index})"
                    >
                        ${index + 1}
                    </button>

                `;

            }
        )
        .join("");


    if(palette){

        palette.innerHTML =
            html;

    }


    if(sidePalette){

        sidePalette.innerHTML =
            html;

    }

}


/* =====================================================
   GO TO QUESTION
===================================================== */

function goToQuestion(index){

    if(
        index < 0 ||
        index >= questions.length
    ){

        return;

    }


    currentQuestion =
        index;


    renderQuestion();


    closeQuestionMenu();

}


/* =====================================================
   RIGHT SIDE MENU
===================================================== */

function toggleQuestionMenu(){

    const menu =
        document.getElementById(
            "questionSideMenu"
        );

    const overlay =
        document.getElementById(
            "questionMenuOverlay"
        );


    menu.classList.toggle(
        "open"
    );

    overlay.classList.toggle(
        "show"
    );

}


function closeQuestionMenu(){

    const menu =
        document.getElementById(
            "questionSideMenu"
        );

    const overlay =
        document.getElementById(
            "questionMenuOverlay"
        );


    menu.classList.remove(
        "open"
    );

    overlay.classList.remove(
        "show"
    );

}


/* =====================================================
   CONFIRM SUBMIT
===================================================== */

function confirmSubmit(){

    if(submitted){

        return;

    }


    const answered =
        answers.filter(
            value =>
                value !== null &&
                value !== undefined
        ).length;


    const unanswered =
        questions.length -
        answered;


    const message =

        "क्या आप Test Submit करना चाहते हैं?\n\n" +

        "कुल Questions: " +
        questions.length +

        "\nAttempted: " +
        answered +

        "\nUnanswered: " +
        unanswered;


    if(
        confirm(message)
    ){

        submitTest(false);

    }

}


/* =====================================================
   SUBMIT TEST
===================================================== */

function submitTest(autoSubmit){

    if(submitted){

        return;

    }


    submitted = true;


    clearInterval(
        timerInterval
    );


    closeQuestionMenu();


    let correct = 0;

    let wrong = 0;

    let unanswered = 0;


    questions.forEach(
        function(question,index){

            const selected =
                answers[index];


            if(
                selected === null ||
                selected === undefined
            ){

                unanswered++;

                return;

            }


            const correctIndex =
                getCorrectIndex(
                    question
                );


            if(
                correctIndex >= 0 &&
                selected ===
                correctIndex
            ){

                correct++;

            }
            else{

                wrong++;

            }

        }
    );


    const total =
        questions.length;


    const percentage =
        total
        ?
        (
            correct / total
        ) * 100
        :
        0;


    document.getElementById(
        "testArea"
    ).style.display =
        "none";


    document.getElementById(
        "result"
    ).style.display =
        "block";


    document.getElementById(
        "resultTestName"
    ).textContent =

        selectedTest.testName ||
        "Free Test";


    document.getElementById(
        "score"
    ).textContent =

        correct +
        " / " +
        total;


    document.getElementById(
        "correctCount"
    ).textContent =
        correct;


    document.getElementById(
        "wrongCount"
    ).textContent =
        wrong;


    document.getElementById(
        "unansweredCount"
    ).textContent =
        unanswered;


    document.getElementById(
        "percentage"
    ).textContent =

        "Percentage: " +

        percentage.toFixed(2) +

        "%";


    saveResult(
        correct,
        wrong,
        unanswered,
        percentage,
        autoSubmit
    );

}


/* =====================================================
   SAVE RESULT LOCAL
===================================================== */

function saveResult(
    correct,
    wrong,
    unanswered,
    percentage,
    autoSubmit
){

    try{

        const student =
            getStudent();


        const result = {

            testId:
                selectedTest.testId ||
                selectedTest.id ||
                "",

            testName:
                selectedTest.testName ||
                "Free Test",

            testType:
                selectedTest.testType ||
                "",

            totalQuestions:
                questions.length,

            correct:
                correct,

            wrong:
                wrong,

            unanswered:
                unanswered,

            percentage:
                Number(
                    percentage.toFixed(2)
                ),

            autoSubmitted:
                autoSubmit === true,

            studentUid:
                student?.uid ||
                "",

            studentName:
                student?.displayName ||
                student?.fullName ||
                student?.name ||
                "",

            completedAt:
                new Date().toISOString()

        };


        const oldResults =
            JSON.parse(
                localStorage.getItem(
                    "freeTestResults"
                ) ||
                "[]"
            );


        if(
            Array.isArray(
                oldResults
            )
        ){

            oldResults.push(
                result
            );

            localStorage.setItem(
                "freeTestResults",
                JSON.stringify(
                    oldResults
                )
            );

        }

    }catch(error){

        console.error(
            "Result save error:",
            error
        );

    }

}


/* =====================================================
   RETRY
===================================================== */

function retryTest(){

    window.location.reload();

}


/* =====================================================
   BACK TO FREE TESTS
===================================================== */

function goBackToFreeTests(){

    window.location.href =
        "free-mock.html";

}


/* =====================================================
   PAGE INIT
===================================================== */

function init(){

    if(
        !showStudent()
    ){

        return;

    }


    selectedTest =
        loadSelectedTest();


    if(!selectedTest){

        document.getElementById(
            "testArea"
        ).innerHTML = `

            <div class="error">

                ❌ कोई Free Test select नहीं है।

                <br><br>

                पहले Free Tests में जाकर
                कोई Test select करें।

                <br><br>

                <button
                    class="nav-btn previous"
                    type="button"
                    onclick="goBackToFreeTests()"
                >
                    ← Free Tests
                </button>

            </div>

        `;

        return;

    }


    const access =
        normalize(
            selectedTest.accessType
        );


    const paid =
        selectedTest.isPaid === true ||
        access === "paid" ||
        access === "paid test" ||
        access === "paid_mock" ||
        Number(
            selectedTest.price || 0
        ) > 0;


    if(paid){

        document.getElementById(
            "testArea"
        ).innerHTML = `

            <div class="error">

                🔒 यह Free Test नहीं है।

                <br><br>

                Paid Test को Free Test page से
                open नहीं किया जा सकता।

                <br><br>

                <button
                    class="nav-btn previous"
                    type="button"
                    onclick="goBackToFreeTests()"
                >
                    ← Back
                </button>

            </div>

        `;

        return;

    }


    document.getElementById(
        "testTitle"
    ).textContent =

        "🆓 " +

        (
            selectedTest.testName ||
            "Free Test"
        );


    document.getElementById(
        "testDescription"
    ).textContent =

        (
            selectedTest.examName
            ?
            selectedTest.examName +
            " · "
            :
            ""
        ) +

        (
            selectedTest.testType
            ?
            selectedTest.testType
            :
            "Free Mock Test"
        );


    const rawQuestions =
        Array.isArray(
            selectedTest.questions
        )
        ?
        selectedTest.questions
        :
        [];


    questions =
        rawQuestions.map(
            normalizeQuestion
        );


    if(!questions.length){

        document.getElementById(
            "testArea"
        ).innerHTML = `

            <div class="error">

                ❌ इस Test में कोई Question नहीं मिला।

                <br><br>

                कृपया Admin में check करें कि
                इस Test के Questions सही
                <b>testId</b> से जुड़े हैं।

                <br><br>

                <button
                    class="nav-btn previous"
                    type="button"
                    onclick="goBackToFreeTests()"
                >
                    ← Free Tests
                </button>

            </div>

        `;

        return;

    }


    answers =
        new Array(
            questions.length
        ).fill(null);


    currentQuestion = 0;


    renderQuestion();

    startTimer();

}


/* =====================================================
   GLOBAL FUNCTIONS
===================================================== */

window.selectAnswer =
    selectAnswer;

window.nextQuestion =
    nextQuestion;

window.previousQuestion =
    previousQuestion;

window.goToQuestion =
    goToQuestion;

window.confirmSubmit =
    confirmSubmit;

window.submitTest =
    submitTest;

window.retryTest =
    retryTest;

window.goBackToFreeTests =
    goBackToFreeTests;

window.toggleQuestionMenu =
    toggleQuestionMenu;

window.closeQuestionMenu =
    closeQuestionMenu;


/* =====================================================
   START
===================================================== */

document.addEventListener(
    "DOMContentLoaded",
    init
);

</script>
