/* =====================================================
   ESCAPE
===================================================== */

function escapeHTML(value){

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


/* =====================================================
   LOAD ANALYSIS
===================================================== */

function loadAnalysis(){

    let attempt = null;


    try{

        attempt =
            JSON.parse(
                sessionStorage.getItem(
                    "lastAttemptData"
                ) ||
                "null"
            );

    }catch(error){

        attempt = null;

    }


    if(!attempt){

        document.getElementById(
            "solutions"
        ).innerHTML = `

            <div class="header">

                ❌ Analysis data नहीं मिला।

            </div>

        `;

        return;

    }


    document.getElementById(
        "testTitle"
    ).textContent =

        attempt.testName ||
        "Mock Test";


    const reviewCount =
        Array.isArray(
            attempt.reviewed
        )

        ?

        attempt.reviewed.filter(
            function(value){

                return value === true;

            }
        ).length

        :

        0;


    document.getElementById(
        "summary"
    ).innerHTML = `

        <div class="score">

            ${Number(
                attempt.correct || 0
            )}

            /

            ${Number(
                attempt.totalQuestions || 0
            )}

        </div>


        <div class="grid">

            <div class="stat">

                📊 Percentage:

                <b>
                    ${Number(
                        attempt.percentage || 0
                    )}%
                </b>

            </div>


            <div class="stat">

                ⏱️ Total Time:

                <b>
                    ${Number(
                        attempt.totalTimeSpent || 0
                    )} sec
                </b>

            </div>


            <div class="stat">

                ✅ Correct:

                <b>
                    ${Number(
                        attempt.correct || 0
                    )}
                </b>

            </div>


            <div class="stat">

                ❌ Wrong:

                <b>
                    ${Number(
                        attempt.wrong || 0
                    )}
                </b>

            </div>


            <div class="stat">

                ⭕ Unanswered:

                <b>
                    ${Number(
                        attempt.unanswered || 0
                    )}
                </b>

            </div>


            <div class="stat">

                ⭐ Review:

                <b>
                    ${reviewCount}
                </b>

            </div>

        </div>

    `;


    const questions =
        Array.isArray(
            attempt.questions
        )

        ?

        attempt.questions

        :

        [];


    const answers =
        Array.isArray(
            attempt.userAnswers
        )

        ?

        attempt.userAnswers

        :

        [];


    const times =
        Array.isArray(
            attempt.questionTimeSpent
        )

        ?

        attempt.questionTimeSpent

        :

        [];


    const reviewed =
        Array.isArray(
            attempt.reviewed
        )

        ?

        attempt.reviewed

        :

        [];


    const container =
        document.getElementById(
            "solutions"
        );


    container.innerHTML = "";


    questions.forEach(
        function(
            question,
            index
        ){

            const userAnswer =
                answers[index];


            const correctAnswer =
                Number(
                    question.correctAnswer
                );


            const isCorrect =

                userAnswer !== null &&

                userAnswer !== undefined &&

                Number(userAnswer) ===
                correctAnswer;


            const userText =

                userAnswer !== null &&

                userAnswer !== undefined &&

                question.options &&

                question.options[
                    userAnswer
                ] !== undefined

                ?

                question.options[
                    userAnswer
                ]

                :

                "Not Attempted";


            const correctText =

                question.options &&

                question.options[
                    correctAnswer
                ] !== undefined

                ?

                question.options[
                    correctAnswer
                ]

                :

                "-";


            let resultClass =
                "wrong";


            let resultText =
                "❌ गलत उत्तर";


            if(
                userAnswer === null ||
                userAnswer === undefined
            ){

                resultClass =
                    "unanswered";

                resultText =
                    "⭕ Not Attempted";

            }
            else if(isCorrect){

                resultClass =
                    "correct";

                resultText =
                    "✅ सही उत्तर";

            }


            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "solution-card";


            card.innerHTML = `

                <div
                    class="question-head"
                >

                    <span>

                        Q${index + 1}.

                        ${escapeHTML(
                            question.question ||
                            ""
                        )}

                    </span>


                    <span
                        class="question-time"
                    >

                        ⏱️

                        ${Number(
                            times[index] || 0
                        )}

                        sec

                    </span>

                </div>


                ${
                    reviewed[index]

                    ?

                    `

                    <p class="review">

                        ⭐ Marked for Review

                    </p>

                    `

                    :

                    ""

                }


                <div class="answer-box">

                    आपका Answer:

                    <b>

                        ${escapeHTML(
                            userText
                        )}

                    </b>

                </div>


                <div class="answer-box">

                    सही Answer:

                    <b class="correct">

                        ${escapeHTML(
                            correctText
                        )}

                    </b>

                </div>


                <p
                    class="${resultClass}"
                >

                    ${resultText}

                </p>


                <div class="solution-box">

                    💡 <b>Solution:</b>

                    <br><br>

                    ${escapeHTML(
                        question.solution ||
                        "Solution उपलब्ध नहीं है।"
                    )}

                </div>

            `;


            container.appendChild(
                card
            );

        }
    );

}


/* =====================================================
   REATTEMPT
===================================================== */

function reattemptTest(){

    let attempt = null;


    try{

        attempt =
            JSON.parse(
                sessionStorage.getItem(
                    "lastAttemptData"
                ) ||
                "null"
            );

    }catch(error){

        attempt = null;

    }


    if(!attempt){

        alert(
            "❌ Test data नहीं मिला।"
        );

        return;

    }


    const newTest = {

        testId:
            attempt.testId ||
            "",

        testName:
            attempt.testName ||
            "Mock Test",

        testType:
            attempt.testType ||
            "mock",

        examName:
            attempt.examName ||
            "",

        subject:
            attempt.subject ||
            "",

        chapter:
            attempt.chapter ||
            "",

        courseId:
            attempt.courseId ||
            "",

        seriesId:
            attempt.seriesId ||
            "",

        seriesName:
            attempt.seriesName ||
            "",

        testTime:
            Number(
                attempt.testTime ||
                0
            ),

        questions:
            attempt.questions ||
            []

    };


    localStorage.setItem(
        "selectedDynamicTest",
        JSON.stringify(
            newTest
        )
    );


    window.location.href =
        "test.html";

}


/* =====================================================
   NAVIGATION
===================================================== */

function goMockTests(){

    window.location.href =
        "mock-test.html";

}


function goDashboard(){

    window.location.href =
        "dashboard.html";

}


window.reattemptTest =
    reattemptTest;

window.goMockTests =
    goMockTests;

window.goDashboard =
    goDashboard;


document.addEventListener(
    "DOMContentLoaded",
    loadAnalysis
);

</script></body></html>
