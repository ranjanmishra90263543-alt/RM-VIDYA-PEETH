/* =====================================================

import {
    initializeApp
}
from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";


import {
    getAuth,
    onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";


import {
    getFirestore,
    collection,
    getDocs,
    query,
    where
}
from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";


const firebaseConfig = {

    apiKey:
        "AIzaSyAqsesw3BWaHK7G1Y1jw0K9kr9suZ1pPV4",

    authDomain:
        "ssc-courses.firebaseapp.com",

    projectId:
        "ssc-courses",

    storageBucket:
        "ssc-courses.firebasestorage.app",

    messagingSenderId:
        "886294132394",

    appId:
        "1:886294132394:web:58b82a2a49f9cd1e0f02d3",

    measurementId:
        "G-9QSCEVYSE5"

};


const app =
    initializeApp(firebaseConfig);


const auth =
    getAuth(app);


const db =
    getFirestore(app);


/* =====================================================
   GLOBAL
===================================================== */

let firebaseUser = null;

let allResults = [];

let groupedTests = {};

let selectedAttempts = {};

let expandedAnalysis = {};

let expandedAnswers = {};


/* =====================================================
   HELPERS
===================================================== */

function escapeHTML(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


function getStudentName(){

    return localStorage.getItem(
        "ssc_student_name"
    )
    ||
    localStorage.getItem(
        "studentName"
    )
    ||
    "Student";

}


function getStudentUsername(){

    return localStorage.getItem(
        "ssc_student_username"
    )
    ||
    localStorage.getItem(
        "studentUsername"
    )
    ||
    "";

}


function showStatus(
    message,
    type="info"
){

    const box =
        document.getElementById("status");

    box.className =
        "status show " + type;

    box.textContent =
        message;

}


/* =====================================================
   DATE
===================================================== */

function getResultTime(result){

    if(
        result.submittedAt &&
        typeof result.submittedAt.toDate === "function"
    ){

        return result.submittedAt.toDate();

    }


    if(
        result.createdAt &&
        typeof result.createdAt.toDate === "function"
    ){

        return result.createdAt.toDate();

    }


    return new Date(0);

}


function formatDate(result){

    const date =
        getResultTime(result);


    if(date.getTime() <= 0){

        return "Date unavailable";

    }


    return date.toLocaleString(
        "en-IN",
        {
            day:"2-digit",
            month:"short",
            year:"numeric",
            hour:"2-digit",
            minute:"2-digit"
        }
    );

}


/* =====================================================
   TIME FORMAT
===================================================== */

function formatMinutes(value){

    const minutes =
        Number(value || 0);


    if(minutes <= 0){

        return "";

    }


    return minutes + " Min";

}


/* =====================================================
   RESULT UNIQUE KEY
===================================================== */

function getTestKey(result){

    /*
       IMPORTANT:
       testId is the main identity.

       इसलिए:
       Polity Sectional Test 1
       और
       Polity Sectional Test 2

       अलग-अलग test रहेंगे।
    */

    if(result.testId){

        return String(
            result.testId
        );

    }


    return (
        String(
            result.testName ||
            "unknown"
        )
        .trim()
        .toLowerCase()
    );

}


/* =====================================================
   LOAD RESULTS
===================================================== */

async function loadResults(){

    if(!firebaseUser){

        document.getElementById(
            "content"
        ).innerHTML = `

            <div class="empty">

                🔐 Student login required.

            </div>

        `;

        return;

    }


    try{

        const resultCollection =
            collection(
                db,
                "testResults"
            );


        /*
           पहले studentUid से खोजेंगे।
        */

        let snap;


        try{

            const q =
                query(
                    resultCollection,
                    where(
                        "studentUid",
                        "==",
                        firebaseUser.uid
                    )
                );


            snap =
                await getDocs(q);

        }
        catch(error){

            console.warn(
                "UID query failed:",
                error
            );

            /*
               Fallback:
               पूरी collection पढ़कर
               studentUid / username से filter
               करेंगे।
            */

            snap =
                await getDocs(
                    resultCollection
                );

        }


        allResults = [];


        snap.forEach(item=>{

            const result =
                {
                    id:item.id,
                    ...item.data()
                };


            /*
               Security-side filtering के साथ
               UI-side filtering भी रख रहे हैं।
            */

            const sameUid =
                result.studentUid &&
                firebaseUser.uid &&
                String(
                    result.studentUid
                ) ===
                String(
                    firebaseUser.uid
                );


            const username =
                getStudentUsername();


            const sameUsername =
                username &&
                result.studentUsername &&
                String(
                    result.studentUsername
                ) ===
                String(username);


            /*
               अगर UID मौजूद है तो UID को priority।
               पुराने result में UID नहीं है तो
               username से match।
            */

            if(
                result.studentUid
                &&
                !sameUid
            ){

                return;

            }


            if(
                !result.studentUid &&
                username &&
                !sameUsername
            ){

                return;

            }


            allResults.push(result);

        });


        /*
           Latest result पहले।
        */

        allResults.sort(
            (a,b)=>
                getResultTime(b).getTime()
                -
                getResultTime(a).getTime()
        );


        groupResults();


        renderTests();


    }
    catch(error){

        console.error(
            "LOAD ATTEMPTS ERROR:",
            error
        );


        document.getElementById(
            "content"
        ).innerHTML = `

            <div class="empty">

                ❌ Attempted Tests load नहीं हुए।

                <br><br>

                ${escapeHTML(
                    error.message
                )}

            </div>

        `;


        showStatus(
            "Firestore से results load नहीं हुए।",
            "error"
        );

    }

}


/* =====================================================
   GROUP RESULTS
===================================================== */

function groupResults(){

    groupedTests = {};


    allResults.forEach(result=>{

        const key =
            getTestKey(result);


        if(!groupedTests[key]){

            groupedTests[key] = [];

        }


        groupedTests[key].push(
            result
        );

    });


    /*
       हर test के अंदर:
       latest -> first

       फिर Attempt 1,2,3...
       chronological order में देंगे।
    */

    Object.keys(
        groupedTests
    )
    .forEach(key=>{

        groupedTests[key].sort(
            (a,b)=>
                getResultTime(a).getTime()
                -
                getResultTime(b).getTime()
        );

    });

}


/* =====================================================
   TEST TITLE
===================================================== */

function getTestTitle(result){

    return (
        result.testName
        ||
        "Untitled Test"
    );

}


/* =====================================================
   TEST META
===================================================== */

function getTestMeta(result){

    const parts = [];


    if(result.subject){

        parts.push(
            "📘 " +
            result.subject
        );

    }


    if(result.chapter){

        parts.push(
            "📖 " +
            result.chapter
        );

    }


    if(result.testType){

        parts.push(
            "📝 " +
            result.testType
        );

    }


    /*
       T15 को कहीं भी show नहीं करना।
       सिर्फ actual time field हो तो
       "15 Min" format में show होगा.
    */

    const testTime =
        result.testTime ??
        result.duration ??
        result.timeLimit;


    if(testTime){

        parts.push(
            "⏱️ " +
            formatMinutes(testTime)
        );

    }


    if(!parts.length){

        return "Mock Test";

    }


    return parts.join("  |  ");

}


/* =====================================================
   RENDER TESTS
===================================================== */

function renderTests(){

    const content =
        document.getElementById(
            "content"
        );


    const keys =
        Object.keys(
            groupedTests
        );


    if(!keys.length){

        content.innerHTML = `

            <div class="empty">

                📭 अभी कोई Attempted Test नहीं है।

                <br><br>

                पहले कोई Mock Test attempt करें।

            </div>

        `;

        return;

    }


    content.innerHTML =
        keys.map(
            (key,testIndex)=>{

                const attempts =
                    groupedTests[key];


                /*
                   Latest = last chronological result.
                */

                const latestIndex =
                    attempts.length - 1;


                /*
                   Default latest attempt.
                */

                if(
                    selectedAttempts[key]
                    === undefined
                ){

                    selectedAttempts[key] =
                        latestIndex;

                }


                const selectedIndex =
                    selectedAttempts[key];


                const selected =
                    attempts[
                        selectedIndex
                    ] ||
                    attempts[
                        latestIndex
                    ];


                const latest =
                    attempts[
                        latestIndex
                    ];


                return renderTestCard(
                    key,
                    attempts,
                    selected,
                    selectedIndex,
                    latest,
                    testIndex
                );

            }
        )
        .join("");

}


/* =====================================================
   RENDER ONE TEST
===================================================== */

function renderTestCard(
    key,
    attempts,
    selected,
    selectedIndex,
    latest,
    testIndex
){

    const latestScore =
        Number(
            latest.score || 0
        );


    const latestPercentage =
        Number(
            latest.percentage || 0
        );


    return `

        <div class="test-card">


            <!-- TEST HEADER -->

            <div class="test-card-header">

                <div class="test-title">

                    ${escapeHTML(
                        getTestTitle(latest)
                    )}

                </div>


                <div class="test-meta">

                    ${escapeHTML(
                        getTestMeta(latest)
                    )}

                </div>

            </div>


            <!-- LATEST -->

            <div class="latest-box">

                <div class="latest-title">

                    ⭐ Latest Attempt -
                    Attempt ${latestIndex + 1}

                </div>


                <div class="latest-score">

                    <div>

                        <div class="score-main">

                            ${latestScore.toFixed(2)}

                        </div>

                        <div style="
                            color:#64748b;
                            font-size:12px;
                            margin-top:3px;
                        ">

                            Score

                        </div>

                    </div>


                    <div class="score-percent">

                        ${latestPercentage.toFixed(2)}%

                    </div>

                </div>

            </div>


            <!-- ATTEMPTS -->

            <div class="attempt-area">

                <div class="attempt-title">

                    📌 Attempts

                </div>


                <div class="attempt-buttons">

                    ${
                        attempts.map(
                            (attempt,index)=>`

                            <button
                                class="
                                    attempt-btn
                                    ${
                                        index === selectedIndex
                                        ?
                                        "active"
                                        :
                                        ""
                                    }
                                    ${
                                        index === latestIndex
                                        ?
                                        "latest"
                                        :
                                        ""
                                    }
                                "
                                onclick="
                                    selectAttempt(
                                        '${escapeHTML(key)}',
                                        ${index}
                                    )
                                "
                            >

                                Attempt ${index + 1}

                                ${
                                    index === latestIndex
                                    ?
                                    " ⭐"
                                    :
                                    ""
                                }

                            </button>

                        `
                        ).join("")
                    }

                </div>

            </div>


            <!-- SELECTED RESULT -->

            ${renderSelectedResult(
                key,
                selected,
                selectedIndex
            )}

        </div>

    `;

}


/* =====================================================
   SELECT ATTEMPT
===================================================== */

window.selectAttempt =
function(
    key,
    index
){

    selectedAttempts[key] =
        index;


    renderTests();


    setTimeout(()=>{

        const cards =
            document.querySelectorAll(
                ".test-card"
            );


        if(cards[index]){

            cards[index]
            .scrollIntoView({
                behavior:"smooth",
                block:"start"
            });

        }

    },50);

};


/* =====================================================
   SELECTED RESULT
===================================================== */

function renderSelectedResult(
    key,
    result,
    attemptIndex
){

    const analysisOpen =
        expandedAnalysis[key]
        === true;


    const answersOpen =
        expandedAnswers[key]
        === true;


    return `

        <div class="result-panel">

            <div class="result-panel-header">

                <div class="result-panel-title">

                    🏆 Attempt ${attemptIndex + 1}
                    Result

                </div>


                <div class="result-date">

                    Submitted:
                    ${escapeHTML(
                        formatDate(result)
                    )}

                </div>

            </div>


            <div class="result-grid">


                <div class="result-box">

                    <div class="result-label">
                        Score
                    </div>

                    <div class="result-value">

                        ${Number(
                            result.score || 0
                        ).toFixed(2)}

                    </div>

                </div>


                <div class="result-box">

                    <div class="result-label">
                        Percentage
                    </div>

                    <div class="result-value">

                        ${Number(
                            result.percentage || 0
                        ).toFixed(2)}%

                    </div>

                </div>


                <div class="result-box">

/* =====================================================
   RENDER ANALYSIS
===================================================== */

function renderAnalysis(result){

    const questionTimes =
        Array.isArray(
            result.questionTimes
        )
        ?
        result.questionTimes
        :
        [];


    let totalTime = 0;


    questionTimes.forEach(item=>{

        totalTime +=
            Number(
                item.timeSpentSeconds
                || 0
            );

    });


    return `

        <div class="analysis-box">

            <div class="analysis-title">

                📊 Test Analysis

            </div>


            <div class="analysis-row">

                <span class="analysis-label">
                    Total Questions
                </span>

                <span class="analysis-value">

                    ${
                        Number(
                            result.correct || 0
                        )
                        +
                        Number(
                            result.wrong || 0
                        )
                        +
                        Number(
                            result.skipped || 0
                        )
                    }

                </span>

            </div>


            <div class="analysis-row">

                <span class="analysis-label">
                    Attempted
                </span>

                <span class="analysis-value">

                    ${Number(
                        result.attempted || 0
                    )}

                </span>

            </div>


            <div class="analysis-row">

                <span class="analysis-label">
                    Correct
                </span>

                <span class="analysis-value"
                      style="color:#16a34a;">

                    ${Number(
                        result.correct || 0
                    )}

                </span>

            </div>


            <div class="analysis-row">

                <span class="analysis-label">
                    Wrong
                </span>

                <span class="analysis-value"
                      style="color:#dc2626;">

                    ${Number(
                        result.wrong || 0
                    )}

                </span>

            </div>


            <div class="analysis-row">

                <span class="analysis-label">
                    Skipped
                </span>

                <span class="analysis-value"
                      style="color:#d97706;">

                    ${Number(
                        result.skipped || 0
                    )}

                </span>

            </div>


            <div class="analysis-row">

                <span class="analysis-label">
                    Score
                </span>

                <span class="analysis-value">

                    ${Number(
                        result.score || 0
                    ).toFixed(2)}

                </span>

            </div>


            <div class="analysis-row">

                <span class="analysis-label">
                    Percentage
                </span>

                <span class="analysis-value">

                    ${Number(
                        result.percentage || 0
                    ).toFixed(2)}%

                </span>

            </div>


            ${
                questionTimes.length
                ?
                `
                <div class="analysis-row">

                    <span class="analysis-label">
                        Total Time Spent
                    </span>

                    <span class="analysis-value">

                        ${formatTotalTime(
                            totalTime
                        )}

                    </span>

                </div>
                `
                :
                ""
            }

        </div>

    `;

}


/* =====================================================
   TOTAL TIME
===================================================== */

function formatTotalTime(seconds){

    seconds =
        Number(seconds || 0);


    const minutes =
        Math.floor(
            seconds / 60
        );


    const sec =
        seconds % 60;


    if(minutes <= 0){

        return sec + " Sec";

    }


    return (
        minutes +
        " Min " +
        sec +
        " Sec"
    );

}


/* =====================================================
   ANSWER REVIEW
===================================================== */

function renderAnswers(result){

    const answers =
        Array.isArray(
            result.answers
        )
        ?
        result.answers
        :
        [];


    if(!answers.length){

        return `

            <div class="answers-box">

                <div class="empty">

                    📖 इस attempt में answer
                    data उपलब्ध नहीं है।

                </div>

            </div>

        `;

    }


    return `

        <div class="answers-box">

            ${
                answers.map(
                    (item,index)=>{

                        const selected =
                            item.selectedAnswer;


                        const correct =
                            item.correctAnswer;


                        const isCorrect =
                            selected !== undefined &&
                            Number(selected)
                            ===
                            Number(correct);


                        const skipped =
                            selected === undefined ||
                            selected === null;


                        let statusClass =
                            "";


                        if(skipped){

                            statusClass =
                                "answer-skipped";

                        }
                        else if(isCorrect){

                            statusClass =
                                "answer-correct";

                        }
                        else{

                            statusClass =
                                "answer-wrong";

                        }


                        return `

                            <div class="answer-card">

                                <div class="answer-question">

                                    Q${
                                        item.questionNumber
                                        ||
                                        index + 1
                                    }

                                </div>


                                <div class="
                                    answer-option
                                    ${statusClass}
                                ">

                                    ${
                                        skipped
                                        ?
                                        "⚪ Not Attempted"
                                        :
                                        isCorrect
                                        ?
                                        "✅ Correct Answer"
                                        :
                                        "❌ Wrong Answer"
                                    }

                                </div>


                                <div class="
                                    answer-option
                                ">

                                    Your Answer:

                                    ${
                                        skipped
                                        ?
                                        "Not Attempted"
                                        :
                                        optionLetter(
                                            selected
                                        )
                                    }

                                </div>


                                <div class="
                                    answer-option
                                    answer-correct
                                ">

                                    Correct Answer:

                                    ${
                                        optionLetter(
                                            correct
                                        )
                                    }

                                </div>


                            </div>

                        `;

                    }
                ).join("")
            }

        </div>

    `;

}


/* =====================================================
   OPTION LETTER
===================================================== */

function optionLetter(value){

    if(
        value === undefined ||
        value === null ||
        value === ""
    ){

        return "—";

    }


    const num =
        Number(value);


    if(
        num >= 0 &&
        num <= 3
    ){

        return [
            "A",
            "B",
            "C",
            "D"
        ][num];

    }


    if(
        num >= 1 &&
        num <= 4
    ){

        return [
            "A",
            "B",
            "C",
            "D"
        ][num - 1];

    }


    const text =
        String(value)
        .trim()
        .toUpperCase();


    if(
        ["A","B","C","D"]
        .includes(text)
    ){

        return text;

    }


    return escapeHTML(value);

}
