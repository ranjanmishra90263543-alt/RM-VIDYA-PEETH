<!doctype html>
<html lang="en">
<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>RM Vidya Peeth - Question Sections</title>

<style>

body{
    margin:0;
    background:#f5f8fb;
    font-family:Arial;
    color:#243447;
}

.wrap{
    max-width:900px;
    margin:auto;
    padding:20px;
}

.head{
    background:linear-gradient(135deg,#0b8fd3,#16a1df);
    color:#fff;
    padding:20px;
    border-radius:14px;
}

.head h2{
    margin:0 0 8px 0;
}

.head p{
    margin:0;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:14px;
    margin-top:16px;
}

.card{
    background:#fff;
    border-radius:14px;
    padding:18px;
    box-shadow:0 3px 14px #0001;
}

.card h3{
    margin-top:0;
}

.btn{
    display:inline-block;
    margin-top:12px;
    background:#0b8fd3;
    color:#fff;
    text-decoration:none;
    padding:9px 13px;
    border-radius:8px;
    font-weight:700;
}

.muted{
    color:#71808d;
    font-size:13px;
}

.the-hub-copyright{
    text-align:center;
    color:#71808d;
    padding:18px 10px;
    margin-top:20px;
    background:#fff;
    font-size:13px;
}

</style>

</head>

<body>

<div class="wrap">

    <div class="head">

        <h2>
            📚 RM Vidya Peeth - Course-wise Question Sections
        </h2>

        <p>
            <strong>By Ranjan Mishra Sir</strong><br>
            Har course ke questions alag section me rahenge.
        </p>

    </div>


    <div
        id="sections"
        class="grid"
    ></div>

</div>


<script>

const defaults = [

    {
        id:'ssc-cgl',
        name:'SSC CGL'
    },

    {
        id:'ssc-chsl',
        name:'SSC CHSL'
    },

    {
        id:'ssc-mts',
        name:'SSC MTS'
    },

    {
        id:'test-pass',
        name:'Test Pass'
    }

];


function load(){

    let courses = defaults;

    try{

        const stored = JSON.parse(
            localStorage.getItem('courses') || '[]'
        );

        if(
            Array.isArray(stored) &&
            stored.length
        ){

            courses = stored.map(c => ({

                id:String(
                    c.id ||
                    c.courseId
                ),

                name:
                    c.name ||
                    c.title ||
                    'Course'

            }));

        }

    }catch(e){}


    document.getElementById('sections').innerHTML =

        courses.map(c => `

            <div class="card">

                <h3>
                    ${esc(c.name)}
                </h3>

                <div class="muted">
                    Only questions belonging to this course/section.
                </div>

                <a
                    class="btn"
                    href="mock-management.html?courseId=${encodeURIComponent(c.id)}"
                >
                    Manage Questions
                </a>

            </div>

        `).join('');

}


function esc(s){

    return String(s).replace(
        /[&<>"']/g,
        m => ({
            '&':'&amp;',
            '<':'&lt;',
            '>':'&gt;',
            '"':'&quot;',
            "'":'&#039;'
        }[m])
    );

}


load();

</script>


<footer
    class="the-hub-copyright"
    aria-label="Copyright"
>

    <div style="font-weight:bold;">
        RM Vidya Peeth
    </div>

    <div style="margin-top:5px;">
        By Ranjan Mishra Sir
    </div>

    <div style="margin-top:5px;">
        © 2026 RM Vidya Peeth. All Rights Reserved.
    </div>

</footer>


</body>
</html>
