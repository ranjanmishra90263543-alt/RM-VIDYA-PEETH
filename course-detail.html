// =====================================================
// FIREBASE
// =====================================================

import { db } from "./firebase-config.js";

import {
    collection,
    getDocs
}
from
"https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";


// =====================================================
// STUDENT LOGIN
// =====================================================

function getCurrentStudent(){

    const keys = [
        "studentUser",
        "currentUser",
        "user"
    ];


    for(const key of keys){

        const raw =
            localStorage.getItem(key);


        if(!raw){

            continue;

        }


        try{

            const user =
                JSON.parse(raw);


            if(
                user &&
                typeof user === "object"
            ){

                return user;

            }

        }
        catch(error){

            console.warn(
                "Invalid student data:",
                key,
                error
            );

        }

    }


    const logged =
        localStorage.getItem(
            "studentLoggedIn"
        );


    if(logged === "true"){

        return {
            loggedIn:true
        };

    }


    return null;

}


// =====================================================
// LOGIN CHECK
// =====================================================

function checkLogin(){

    const student =
        getCurrentStudent();


    if(!student){

        window.location.replace(
            "login.html"
        );

        return false;

    }


    return true;

}


// =====================================================
// COURSE ID
// =====================================================

function getCourseId(){

    const params =
        new URLSearchParams(
            window.location.search
        );


    return String(
        params.get("courseId") || ""
    ).trim();

}


// =====================================================
// LOCAL COURSES
// =====================================================

function getLocalCourses(){

    try{

        const data =
            JSON.parse(
                localStorage.getItem(
                    "ssc_courses"
                ) || "[]"
            );


        return Array.isArray(data)
            ? data
            : [];

    }
    catch(error){

        console.warn(
            "Local courses error:",
            error
        );

        return [];

    }

}


// =====================================================
// FIREBASE COURSES
// =====================================================

async function getFirebaseCourses(){

    try{

        const snapshot =
            await getDocs(
                collection(
                    db,
                    "courses"
                )
            );


        const courses = [];


        snapshot.forEach(function(item){

            const data =
                item.data() || {};


            courses.push({

                ...data,

                id:
                    data.id ||
                    data.courseId ||
                    data.courseID ||
                    item.id

            });

        });


        return courses;

    }
    catch(error){

        console.warn(
            "Firebase courses error:",
            error
        );

        return [];

    }

}


// =====================================================
// FIND COURSE
// =====================================================

async function findCourse(courseId){

    const id =
        String(
            courseId
        ).trim();


    const firebaseCourses =
        await getFirebaseCourses();


    let course =
        firebaseCourses.find(
            function(item){

                return String(

                    item.id ||
                    item.courseId ||
                    item.courseID ||
                    ""

                ).trim() === id;

            }
        );


    if(course){

        return course;

    }


    const localCourses =
        getLocalCourses();


    course =
        localCourses.find(
            function(item){

                return String(

                    item.id ||
                    item.courseId ||
                    item.courseID ||
                    ""

                ).trim() === id;

            }
        );


    if(course){

        return course;

    }


    try{

        const saved =
            JSON.parse(
                localStorage.getItem(
                    "selectedCourse"
                ) || "null"
            );


        if(saved){

            const savedId =
                String(

                    saved.id ||
                    saved.courseId ||
                    saved.courseID ||
                    ""

                ).trim();


            if(savedId === id){

                return saved;

            }

        }

    }
    catch(error){

        console.warn(
            "Selected course error:",
            error
        );

    }


    return null;

}


// =====================================================
// PAID
// =====================================================

function isPaid(course){

    if(!course){

        return false;

    }


    const access =
        String(
            course.accessType || ""
        )
        .trim()
        .toLowerCase();


    const type =
        String(
            course.type || ""
        )
        .trim()
        .toLowerCase();


    const courseType =
        String(
            course.courseType || ""
        )
        .trim()
        .toLowerCase();


    return (

        course.isPaid === true ||

        course.paid === true ||

        access === "paid" ||

        type === "paid" ||

        courseType === "paid"

    );

}


// =====================================================
// PRICE
// =====================================================

function getPrice(course){

    if(!course){

        return 0;

    }


    const possiblePrices = [

        course.price,

        course.amount,

        course.coursePrice,

        course.salePrice,

        course.fee

    ];


    for(const value of possiblePrices){

        if(
            value !== undefined &&
            value !== null &&
            value !== ""
        ){

            const number =
                Number(value);


            if(
                Number.isFinite(number) &&
                number > 0
            ){

                return number;

            }

        }

    }


    return 0;

}


// =====================================================
// TEST PASS
// =====================================================

function isTestPass(course){

    const name =
        String(
            course?.name ||
            course?.courseName ||
            course?.title ||
            ""
        )
        .trim()
        .toLowerCase();


    const type =
        String(
            course?.type ||
            ""
        )
        .trim()
        .toLowerCase();


    const courseType =
        String(
            course?.courseType ||
            ""
        )
        .trim()
        .toLowerCase();


    return (

        course?.testPass === true ||

        course?.isTestPass === true ||

        type === "test-pass" ||

        courseType === "test-pass" ||

        name.includes("test pass") ||

        name.includes("test-pass")

    );

}


// =====================================================
// SAVE PAYMENT COURSE
// =====================================================

function savePaymentCourse(course){

    const id =
        String(

            course.id ||
            course.courseId ||
            course.courseID ||
            ""

        ).trim();


    const name =
        course.name ||
        course.courseName ||
        course.title ||
        "Course";


    const price =
        getPrice(course);


    const paymentCourse = {

        id:
            id,

        courseId:
            id,

        courseID:
            id,

        name:
            name,

        courseName:
            name,

        title:
            name,

        price:
            price,

        amount:
            price,

        courseType:
            course.courseType ||
            course.type ||
            "",

        type:
            course.type ||
            "",

        accessType:
            course.accessType ||
            (
                price > 0
                ? "paid"
                : "free"
            ),

        isPaid:
            isPaid(course),

        paid:
            isPaid(course),

        isTestPass:
            course.isTestPass === true ||
            course.testPass === true,

        testPass:
            course.testPass === true

    };


    localStorage.setItem(
        "paymentCourse",
        JSON.stringify(
            paymentCourse
        )
    );


    return paymentCourse;

}


// =====================================================
// RENDER COURSE
// =====================================================

function renderCourse(course){

    const container =
        document.getElementById(
            "container"
        );


    const id =
        String(

            course.id ||
            course.courseId ||
            course.courseID ||
            ""

        ).trim();


    const name =
        course.name ||
        course.courseName ||
        course.title ||
        "Course";


    const exam =
        course.exam ||
        course.courseExam ||
        course.examName ||
        "RM Vidya Peeth";


    const description =
        course.description ||
        course.desc ||
        "इस course में अपनी तैयारी शुरू करें।";


    const category =
        course.category ||
        course.examCategory ||
        "-";


    const duration =
        course.duration ||
        course.courseDuration ||
        "-";


    const subjects =
        Array.isArray(
            course.subjects
        )
        ? course.subjects
        : [];


    const paid =
        isPaid(course);


    const testPass =
        isTestPass(course);


    const price =
        getPrice(course);


    localStorage.setItem(
        "selectedCourseId",
        id
    );


    localStorage.setItem(
        "selectedCourse",
        JSON.stringify(
            course
        )
    );


    let accessHTML = "";


    if(paid){

        accessHTML = `

            <span class="badge paid">

                💳 ${
                    testPass
                    ? "Paid Test Pass"
                    : "Paid Course"
                }

                · ₹${price}

            </span>


            <button
                class="start-btn payment-btn"
                onclick="goPayment()"
                type="button"
            >

                💳 Buy / Pay Now

            </button>

        `;

    }
    else{

        accessHTML = `

            <span class="badge free">

                ${
                    testPass
                    ? "🎟️ Free Test Pass"
                    : "🆓 Free Course"
                }

            </span>


            <button
                class="start-btn"
                onclick="startCourse()"
                type="button"
            >

                ${
                    testPass
                    ? "🎟️ Open Test Pass"
                    : "🚀 Start Course"
                }

            </button>

        `;

    }


    container.innerHTML = `

        <div class="header">

            <div class="brand-title">
                RM Vidya Peeth
            </div>

            <div class="brand-tagline">
                By Ranjan Mishra Sir
            </div>


            <div class="icon">

                ${
                    testPass
                    ? "🎟️"
                    : "📚"
                }

            </div>


            <h1>
                ${escapeHTML(name)}
            </h1>


            <p>
                ${escapeHTML(exam)}
            </p>


            <div class="info-grid">

                <div class="info">

                    <small>
                        🏛️ Exam
                    </small>

                    <b>
                        ${escapeHTML(exam)}
                    </b>

                </div>


                <div class="info">

                    <small>
                        📂 Category
                    </small>

                    <b>
                        ${escapeHTML(category)}
                    </b>

                </div>


                <div class="info">

                    <small>
                        📚 Subjects
                    </small>

                    <b>
                        ${subjects.length}
                    </b>

                </div>


                <div class="info">

                    <small>
                        ⏱️ Duration
                    </small>

                    <b>
                        ${escapeHTML(duration)}
                    </b>

                </div>

            </div>


            <div class="course-id">

                Course ID:
                ${escapeHTML(id)}

            </div>


            ${accessHTML}

        </div>


        <div class="section">

            <h2>
                📖 About This Course
            </h2>


            <div class="description">

                ${escapeHTML(
                    description
                )}

            </div>

        </div>

    `;

}


// =====================================================
// START FREE COURSE
// =====================================================

function startCourse(){

    const student =
        getCurrentStudent();


    if(!student){

        window.location.replace(
            "login.html"
        );

        return;

    }


    const courseId =
        getCourseId();


    if(!courseId){

        alert(
            "❌ Course ID missing."
        );

        return;

    }


    localStorage.setItem(
        "selectedCourseId",
        courseId
    );


    window.location.href =
        "course-chapters.html?courseId=" +
        encodeURIComponent(
            courseId
        );

}


// =====================================================
// PAYMENT
// =====================================================

async function goPayment(){

    const student =
        getCurrentStudent();


    if(!student){

        window.location.replace(
            "login.html"
        );

        return;

    }


    const id =
        getCourseId();


    if(!id){

        alert(
            "❌ Course ID नहीं मिली।"
        );

        return;

    }


    try{

        const course =
            await findCourse(id);


        if(!course){

            alert(
                "❌ Course नहीं मिला।"
            );

            return;

        }


        const price =
            getPrice(course);


        if(
            !Number.isFinite(price) ||
            price <= 0
        ){

            alert(
                "❌ इस course की price सही नहीं है।"
            );

            return;

        }


        localStorage.removeItem(
            "paymentCourse"
        );


        const courseId =
            String(

                course.id ||
                course.courseId ||
                course.courseID ||
                id

            ).trim();


        const courseName =
            course.name ||
            course.courseName ||
            course.title ||
            "Paid Course";


        const testPass =
            isTestPass(course);


        const paymentCourse = {

            id:
                courseId,

            courseId:
                courseId,

            courseID:
                courseId,

            name:
                courseName,

            courseName:
                courseName,

            title:
                courseName,

            price:
                price,

            amount:
                price,

            accessType:
                course.accessType ||
                "paid",

            isPaid:
                true,

            paid:
                true,

            type:
                course.type ||
                "course",

            courseType:
                course.courseType ||
                course.type ||
                "course",

            isTestPass:
                testPass,

            testPass:
                testPass

        };


        localStorage.setItem(
            "paymentCourse",
            JSON.stringify(
                paymentCourse
            )
        );


        console.log(
            "================================="
        );

        console.log(
            "CURRENT PAYMENT COURSE"
        );

        console.log(
            paymentCourse
        );

        console.log(
            "================================="
        );


        window.location.href =
            "payment.html";

    }
    catch(error){

        console.error(
            "Payment redirect error:",
            error
        );


        alert(
            "❌ Payment page खोलने में समस्या हुई।\n\n" +
            error.message
        );

    }

}


// =====================================================
// ERROR
// =====================================================

function showError(message){

    document.getElementById(
        "container"
    ).innerHTML = `

        <div class="error">

            ${escapeHTML(message)}

            <br><br>

            <button
                class="start-btn"
                onclick="goCourses()"
                type="button"
            >

                ← Back to Courses

            </button>

        </div>

    `;

}


// =====================================================
// BACK
// =====================================================

function goCourses(){

    window.location.href =
        "courses.html";

}


// =====================================================
// ESCAPE HTML
// =====================================================

function escapeHTML(value){

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


// =====================================================
// GLOBAL FUNCTIONS
// =====================================================

window.goCourses =
    goCourses;

window.startCourse =
    startCourse;

window.goPayment =
    goPayment;


// =====================================================
// START
// =====================================================

document.addEventListener(
    "DOMContentLoaded",
    async function(){

        if(!checkLogin()){

            return;

        }


        const courseId =
            getCourseId();


        if(!courseId){

            showError(
                "❌ Course ID नहीं मिला।"
            );

            return;

        }


        try{

            const course =
                await findCourse(
                    courseId
                );


            if(!course){

                showError(
                    "❌ यह Course उपलब्ध नहीं है।"
                );

                return;

            }


            renderCourse(
                course
            );

        }
        catch(error){

            console.error(
                "Course Detail Error:",
                error
            );


            showError(
                "❌ Course load नहीं हो पाया।"
            );

        }

    }
);

</script></body></html>
